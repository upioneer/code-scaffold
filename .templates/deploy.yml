name: Continuous Integration and Delivery Pipes

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  hygiene_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Architecture Dependencies
        run: npm ci

      - name: Enforce Code Styling and Formatting
        run: npm run lint

      - name: Execute Project Test Suite
        run: npm test

  deploy_production:
    needs: hygiene_and_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Vercel Command Line Interface
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compile Production Build Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Execute Live Deployment Routing
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
