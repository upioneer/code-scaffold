name: Continuous Integration and Matrix Distribution Pipeline

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  code_hygiene:
    name: Code Hygiene and Test Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Initialize Rust Infrastructure
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Code Formatting Check
        run: cargo fmt
        working-directory: scaffold-tui

      - name: Execute Compiler Static Analysis
        run: cargo clippy
        working-directory: scaffold-tui

      - name: Run Native Architecture Tests
        run: cargo test --all-features
        working-directory: scaffold-tui

  matrix_release:
    name: Compilation Matrix Release Execution
    needs: code_hygiene
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: code-scaffold-linux-x64.tar.gz
            ota_artifact_name: ota-payload-linux-x64.tar.gz
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact_name: code-scaffold-linux-arm64.tar.gz
            ota_artifact_name: ota-payload-linux-arm64.tar.gz
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: code-scaffold-windows-arm64.zip
            ota_artifact_name: ota-payload-windows-arm64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: code-scaffold-macos-arm64.tar.gz
            ota_artifact_name: ota-payload-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: code-scaffold-windows-x64.zip
            ota_artifact_name: ota-payload-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Initialize Rust Infrastructure Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Cross Compiler Tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Compile Release Target Binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: scaffold-tui
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Consolidate Output Files (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp scaffold-tui/target/${{ matrix.target }}/release/code-scaffold ./code-scaffold
          tar -czvf ${{ matrix.artifact_name }} code-scaffold
          cp code-scaffold ./update.bin
          tar -czvf ${{ matrix.ota_artifact_name }} update.bin

      - name: Consolidate Output Files (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy scaffold-tui\target\${{ matrix.target }}\release\code-scaffold.exe .\code-scaffold.exe
          Compress-Archive -Path code-scaffold.exe -DestinationPath ${{ matrix.artifact_name }}
          copy scaffold-tui\target\${{ matrix.target }}\release\code-scaffold.exe .\update.exe
          Compress-Archive -Path update.exe -DestinationPath ${{ matrix.ota_artifact_name }}

      - name: Stage Workspace Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            ./${{ matrix.artifact_name }}
            ./${{ matrix.ota_artifact_name }}

  publish_release_binaries:
    name: Publish Release Asset Pool
    needs: matrix_release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Gather Staged Construction Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Build Global Deployment Release Hub
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
