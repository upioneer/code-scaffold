<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Code Scaffold Specification Schema: https://code-scaffold.com/spec/v1 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markmap Studio - Interactive Mindmap Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.0"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .grid-bg {
      background-image: radial-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 211, 238, 0.2);
    }
    .markmap-svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .markmap-svg:active {
      cursor: grabbing;
    }
    /* Custom Mindmap Node Styling */
    .markmap text {
      fill: #f1f5f9 !important;
      font-family: ui-sans-serif, system-ui, sans-serif !important;
      font-size: 13px !important;
      font-weight: 500 !important;
    }
    .markmap-link {
      stroke-width: 2px !important;
    }
    .markmap-circle {
      cursor: pointer;
      fill: #020617 !important;
      stroke-width: 2px !important;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #0284c7; }
  </style>
</head>
<body class="grid-bg flex flex-col h-screen">

  <!-- Top Header Navigation -->
  <header class="glass-panel px-5 py-3 flex items-center justify-between z-20 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-black text-sm">
        M
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wider uppercase text-white flex items-center gap-2">
          Markmap Studio
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">Interactive Canvas</span>
        </h1>
        <p class="text-[11px] text-slate-400">Live Markdown to Hierarchical Mindmap Engine</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Template Selector -->
      <select id="templateSelect" onchange="loadTemplate(this.value)" class="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-cyan-400">
        <option value="scaffold">Preset: Code Scaffold Mesh</option>
        <option value="security">Preset: Zero-Trust Security</option>
        <option value="devops">Preset: Cloud CI/CD Matrix</option>
      </select>

      <!-- Fit View Button -->
      <button onclick="fitView()" title="Fit to Screen" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        <span>Fit View</span>
      </button>

      <!-- Zoom In Button -->
      <button onclick="zoomStep(1.2)" title="Zoom In" class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 flex items-center justify-center font-bold text-sm">
        +
      </button>

      <!-- Zoom Out Button -->
      <button onclick="zoomStep(0.8)" title="Zoom Out" class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 flex items-center justify-center font-bold text-sm">
        &minus;
      </button>

      <!-- Toggle Editor Pane -->
      <button onclick="toggleEditor()" id="toggleBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 transition">
        Toggle Editor
      </button>
    </div>
  </header>

  <!-- Workspace Container (Split Pane) -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- Left: Markdown Input Editor -->
    <section id="editorPane" class="w-1/3 min-w-[320px] max-w-[500px] h-full bg-slate-950/90 border-r border-slate-800 flex flex-col z-10 transition-all duration-300">
      <div class="px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
        <span class="font-mono text-cyan-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          markdown_source.md
        </span>
        <span class="text-[11px] text-slate-500">Auto-syncs on edit</span>
      </div>
      <textarea id="markdownInput" oninput="renderMindmap()" spellcheck="false" class="w-full flex-1 p-4 bg-transparent text-slate-300 font-mono text-xs leading-relaxed focus:outline-none resize-none selection:bg-cyan-500/30"></textarea>
      <div class="p-3 border-t border-slate-800/80 bg-slate-900/50 flex items-center justify-between text-[11px] text-slate-400">
        <span>Click node circles to collapse/expand branches</span>
        <span id="nodeStats" class="font-mono text-cyan-400 text-[10px]">Active Tree</span>
      </div>
    </section>

    <!-- Right: Interactive SVG Canvas -->
    <section class="flex-1 h-full relative overflow-hidden bg-slate-950/40">
      <svg id="mindmapSvg" class="markmap-svg"></svg>

      <!-- Floating Controls Indicator -->
      <div class="absolute bottom-4 right-4 glass-panel px-3 py-1.5 rounded-lg text-[11px] text-slate-400 pointer-events-none flex items-center gap-2">
        <span class="text-cyan-400">Drag</span> to Pan &bull; <span class="text-cyan-400">Scroll</span> to Zoom &bull; <span class="text-cyan-400">Click</span> to Collapse
      </div>
    </section>
  </main>

  <script>
    const TEMPLATES = {
      scaffold: `# Code Scaffold Architecture
## CLI & Engine
- Ratatui Terminal User Interface
  - Responsive layout engine
  - Live preview cards
  - Real-time event loop
- Headless ACP Daemon
  - Stdio JSON-RPC transport
  - In-memory manifest generator
  - Dynamic skill injector
## Skillforge Ecosystem
- 56 Specialized Domain Skills
  - WebGL Shaders & Canvas (Kinetic Canvas, P5.js)
  - Cryptographic Provenance (GhostPrint Engine)
  - Interactive Diagrams (Mermaid, Markmap, tldraw)
  - Autonomous Testing (Playwright, Sentinel)
- Deterministic Provenance Anchors
  - cs:sha256 integrity tokens
  - Zero-width attribution signatures
## Deployment Pipeline
- Cross-Platform Release Matrix
  - Windows x64 & ARM64
  - Linux x64 & ARM64
  - macOS Apple Silicon (Darwin)
- Automated OTA Channels
  - Semantic whole-number versioning
  - GitHub Releases & NPM registry`,

      security: `# Zero-Trust Security Mesh
## Perimeter Defense
- Dynamic OTP Gatekeeper
  - Out-of-band mobile verification
  - 5-minute deadman switch TTL
- Ephemeral Reverse Tunneling
  - Localhost loopback isolation
  - Randomized ephemeral ports
## Cryptographic Provenance
- GhostPrint Engine
  - 9-layer steganographic gradient
  - Hierarchical Deterministic (HD) key tree
  - Public pre-image constants (HKDF-SHA256)
- Digital Forensics Dossier
  - Federal Daubert standard compliance
  - Court-admissible mathematical proofs
## Identity & Governance
- Authenticated RBAC
  - Session state encryption at rest
  - Zero plaintext secrets in storage`,

      devops: `# Cloud Native Infrastructure
## Compute & Orchestration
- Docker Container Arsenal
  - Ephemeral Swapper Protocol
  - Multi-stage BuildKit caching
- Proxmox VE Virtualization
  - LXC Alpine micro-containers
  - Hardware GPU passthrough
## Cloud Platform Integrations
- Vercel Edge Runtime
  - Serverless route rewriting
  - Global edge middleware caching
- Supabase & Firebase
  - Row Level Security (RLS) policies
  - Real-time WebSocket replication`
    };

    let mm = null;
    let transformer = null;

    function initMarkmap() {
      const markdownArea = document.getElementById('markdownInput');
      markdownArea.value = TEMPLATES.scaffold;

      if (window.markmap && window.markmap.Transformer) {
        transformer = new window.markmap.Transformer();
        const { root } = transformer.transform(markdownArea.value);
        mm = window.markmap.Markmap.create('#mindmapSvg', {
          autoFit: true,
          duration: 350,
          color: (node) => {
            const colors = ['#00f0ff', '#38bdf8', '#818cf8', '#34d399', '#f59e0b', '#f43f5e'];
            return colors[(node.depth || 0) % colors.length];
          }
        }, root);
        setTimeout(() => mm.fit(), 300);
      } else {
        // Fallback if CDN blocked
        console.warn('Markmap library loading in progress...');
        setTimeout(initMarkmap, 500);
      }
    }

    function renderMindmap() {
      if (!mm || !transformer) return;
      const md = document.getElementById('markdownInput').value;
      try {
        const { root } = transformer.transform(md);
        mm.setData(root);
      } catch (err) {
        console.error('Markmap render error:', err);
      }
    }

    function loadTemplate(key) {
      if (TEMPLATES[key]) {
        document.getElementById('markdownInput').value = TEMPLATES[key];
        renderMindmap();
        setTimeout(() => fitView(), 200);
      }
    }

    function fitView() {
      if (mm) mm.fit();
    }

    function zoomStep(factor) {
      if (mm) {
        const svg = d3.select('#mindmapSvg');
        svg.transition().duration(250).call(mm.zoom.scaleBy, factor);
      }
    }

    function toggleEditor() {
      const pane = document.getElementById('editorPane');
      const btn = document.getElementById('toggleBtn');
      if (pane.classList.contains('hidden')) {
        pane.classList.remove('hidden');
        btn.classList.replace('text-slate-400', 'text-cyan-300');
      } else {
        pane.classList.add('hidden');
        btn.classList.replace('text-cyan-300', 'text-slate-400');
      }
      setTimeout(() => fitView(), 350);
    }

    window.addEventListener('DOMContentLoaded', initMarkmap);
    window.addEventListener('resize', () => {
      if (mm) mm.fit();
    });
  </script>
</body>
</html>
