<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excalidraw - Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; min-height: 100vh; overflow-x: hidden; background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(34, 211, 238, 0.2); }
        .grid-bg { background-image: radial-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px); background-size: 30px 30px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { display: inline-block; width: 8px; height: 1.2em; background-color: #22d3ee; vertical-align: text-bottom; animation: blink 1s step-end infinite; }
    </style>
</head>
<body class="grid-bg relative antialiased selection:bg-cyan-500/30">
    
    <!-- Background Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-cyan-600/10 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 glass-panel border-x-0 border-t-0 border-b-slate-800/80 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-cyan-500/20 flex items-center justify-center border border-cyan-500/50 text-cyan-400 font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                </div>
                <h1 class="text-xl font-black uppercase tracking-widest text-white">Excalidraw</h1>
            </div>
            <code class="px-3 py-1.5 bg-cyan-950/50 text-cyan-400 text-xs font-mono rounded-full border border-cyan-900 tracking-wide hidden sm:inline-block">npx @code-scaffold/skills install excalidraw</code>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 relative z-10 space-y-12">
        
        <section id="hero" class="text-center max-w-4xl mx-auto space-y-6 opacity-0 translate-y-8">
            <h2 class="text-4xl md:text-5xl font-black text-white leading-tight">
                Declarative <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Visual Topologies</span>
            </h2>
            <p class="text-lg md:text-xl text-slate-400 leading-relaxed">
                This skill grants the agent the ability to design, generate, and edit professional visual diagrams using the Excalidraw JSON format. Try the live interactive sandbox below.
            </p>
        </section>

        <!-- Live Demo Canvas -->
        <section id="demo" class="w-full h-[600px] rounded-2xl overflow-hidden border border-slate-700 shadow-2xl opacity-0 translate-y-8 relative group">
            <div class="absolute inset-0 bg-slate-900 flex items-center justify-center z-0">
                <div class="flex flex-col items-center gap-4 text-cyan-500">
                    <svg class="w-10 h-10 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span class="font-mono text-sm tracking-widest uppercase">Mounting Canvas...</span>
                </div>
            </div>
            <iframe src="https://excalidraw.com/?theme=dark" class="w-full h-full relative z-10 border-0" title="Excalidraw Live Sandbox"></iframe>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tl = gsap.timeline();
            tl.to("#hero", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" })
              .to("#demo", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, "-=0.4");
        });
    </script>
</body>
</html>
