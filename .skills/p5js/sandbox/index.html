<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5.js Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; min-height: 100vh; overflow-x: hidden; background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(34, 211, 238, 0.2); }
        .grid-bg { background-image: radial-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px); background-size: 30px 30px; }
        #canvas-container { width: 100%; height: 500px; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 1rem; }
    </style>
</head>
<body class="grid-bg relative antialiased selection:bg-cyan-500/30">
    
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-cyan-600/10 rounded-full blur-[150px] pointer-events-none"></div>

    <header class="sticky top-0 z-50 glass-panel border-x-0 border-t-0 border-b-slate-800/80 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-cyan-500/20 flex items-center justify-center border border-cyan-500/50 text-cyan-400 font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3"></path></svg>
                </div>
                <h1 class="text-xl font-black uppercase tracking-widest text-white">P5.js Canvas</h1>
            </div>
            <code class="px-3 py-1.5 bg-cyan-950/50 text-cyan-400 text-xs font-mono rounded-full border border-cyan-900 hidden sm:inline-block">npx @code-scaffold/skills install p5js</code>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 relative z-10 space-y-12">
        <section id="hero" class="text-center max-w-4xl mx-auto space-y-6 opacity-0 translate-y-8">
            <h2 class="text-4xl md:text-5xl font-black text-white leading-tight">
                Generative <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Visuals</span>
            </h2>
            <p class="text-lg md:text-xl text-slate-400 leading-relaxed">
                Interact with the generative canvas below. This sandbox validates the agent's ability to scaffold P5.js physics and WebGL topologies directly into applications.
            </p>
        </section>

        <section id="demo" class="glass-panel p-2 rounded-2xl border border-slate-700 shadow-2xl opacity-0 translate-y-8 relative overflow-hidden">
            <div id="canvas-container" class="bg-slate-950 relative cursor-crosshair"></div>
        </section>
    </main>

    <script>
        // P5.js sketch
        let particles = [];
        function setup() {
            let canvas = createCanvas(windowWidth > 1100 ? 1100 : windowWidth - 60, 500);
            canvas.parent('canvas-container');
            for(let i = 0; i < 100; i++){
                particles.push(new Particle());
            }
        }
        function draw() {
            background(2, 6, 23, 50); // Slate 950 with trailing
            for(let i = 0; i < particles.length; i++) {
                particles[i].createParticle();
                particles[i].moveParticle();
                particles[i].joinParticles(particles.slice(i));
            }
        }
        function windowResized() {
            resizeCanvas(windowWidth > 1100 ? 1100 : windowWidth - 60, 500);
        }
        
        class Particle {
            constructor(){
                this.x = random(0,width);
                this.y = random(0,height);
                this.r = random(1,4);
                this.xSpeed = random(-1.5,1.5);
                this.ySpeed = random(-1,1.5);
            }
            createParticle() {
                noStroke();
                fill('rgba(34,211,238,0.5)'); // Cyan 400
                circle(this.x,this.y,this.r);
            }
            moveParticle() {
                if(this.x < 0 || this.x > width) this.xSpeed*=-1;
                if(this.y < 0 || this.y > height) this.ySpeed*=-1;
                this.x+=this.xSpeed;
                this.y+=this.ySpeed;
            }
            joinParticles(particles) {
                particles.forEach(element =>{
                    let dis = dist(this.x,this.y,element.x,element.y);
                    if(dis<85) {
                        stroke('rgba(34,211,238,0.1)'); // Cyan 400 faint
                        line(this.x,this.y,element.x,element.y);
                    }
                    // Interactive mouse
                    let mouseDis = dist(mouseX, mouseY, this.x, this.y);
                    if(mouseDis < 100) {
                        stroke('rgba(59,130,246,0.3)'); // Blue 500
                        line(this.x,this.y,mouseX,mouseY);
                    }
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const tl = gsap.timeline();
            tl.to("#hero", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" })
              .to("#demo", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, "-=0.4");
        });
    </script>
</body>
</html>
