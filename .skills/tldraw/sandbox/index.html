<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Code Scaffold Specification Schema: https://code-scaffold.com/spec/v1 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tldraw Studio - Spatial Computing & Canvas Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .grid-bg {
      background-color: #020617;
      background-image: radial-gradient(rgba(34, 211, 238, 0.12) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 211, 238, 0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .tool-active {
      background: rgba(34, 211, 238, 0.25) !important;
      color: #22d3ee !important;
      border-color: rgba(34, 211, 238, 0.6) !important;
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Top Floating Header -->
  <header class="glass-panel fixed top-3 left-4 right-4 h-14 rounded-2xl flex items-center justify-between px-5 z-30 shadow-2xl border border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-black text-sm">
        T
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wider uppercase text-white flex items-center gap-2">
          tldraw Studio
          <span class="text-[10px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/30">SPATIAL COMPUTING ENGINE</span>
        </h1>
        <p class="text-xs text-slate-400 hidden sm:block">Infinite Spatial Whiteboard &bull; Cinematic Node Graphs</p>
      </div>
    </div>

    <!-- Active Tool Status Badge -->
    <div class="flex items-center gap-2 text-xs font-mono bg-slate-950/80 px-3 py-1.5 rounded-lg border border-slate-800">
      <span class="text-slate-400">TOOL:</span>
      <span id="active-tool-label" class="text-cyan-400 font-bold uppercase">SELECT</span>
      <span class="text-slate-600">|</span>
      <span class="text-slate-400">ZOOM:</span>
      <span id="zoom-level" class="text-slate-200 font-bold">100%</span>
    </div>

    <!-- Right Quick Actions -->
    <div class="flex items-center gap-2">
      <button onclick="loadTemplate()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        <span>Sample Graph</span>
      </button>
      <button onclick="clearCanvas()" class="px-3 py-1.5 text-xs bg-red-950/40 hover:bg-red-900/60 text-red-400 rounded-lg border border-red-800/40 transition">
        Clear
      </button>
    </div>
  </header>

  <!-- Left Floating Canvas Toolbar -->
  <div class="fixed left-4 top-24 bottom-24 w-14 glass-panel rounded-2xl flex flex-col items-center py-4 gap-2 z-30 shadow-2xl border border-slate-800">
    <button onclick="setTool('select')" id="tool-select" title="Select & Move (V)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition tool-active border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
    </button>
    <button onclick="setTool('draw')" id="tool-draw" title="Pen Draw (P)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
    </button>
    <button onclick="setTool('rect')" id="tool-rect" title="Rectangle (R)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/></svg>
    </button>
    <button onclick="setTool('circle')" id="tool-circle" title="Ellipse (O)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
    </button>
    <button onclick="setTool('arrow')" id="tool-arrow" title="Arrow Connector (A)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </button>
    <button onclick="setTool('note')" id="tool-note" title="Sticky Note (N)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
    </button>
    <button onclick="setTool('text')" id="tool-text" title="Text Label (T)" class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/60 transition border border-transparent">
      <span class="font-serif font-black text-base">T</span>
    </button>

    <div class="w-8 h-px bg-slate-800 my-1"></div>

    <!-- Color Dots -->
    <div class="flex flex-col gap-1.5">
      <button onclick="setColor('#22d3ee')" class="w-5 h-5 rounded-full bg-cyan-400 border border-slate-700 hover:scale-110 transition ring-2 ring-cyan-400/50" id="color-cyan"></button>
      <button onclick="setColor('#a855f7')" class="w-5 h-5 rounded-full bg-purple-500 border border-slate-700 hover:scale-110 transition" id="color-purple"></button>
      <button onclick="setColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-400 border border-slate-700 hover:scale-110 transition" id="color-emerald"></button>
      <button onclick="setColor('#f59e0b')" class="w-5 h-5 rounded-full bg-amber-400 border border-slate-700 hover:scale-110 transition" id="color-amber"></button>
      <button onclick="setColor('#f8fafc')" class="w-5 h-5 rounded-full bg-slate-100 border border-slate-700 hover:scale-110 transition" id="color-white"></button>
    </div>
  </div>

  <!-- Zoom & Viewport Controls (Bottom Left) -->
  <div class="fixed bottom-4 left-4 glass-panel rounded-xl px-3 py-1.5 flex items-center gap-2 z-30 shadow-xl border border-slate-800 text-xs">
    <button onclick="zoomDelta(1.2)" class="w-7 h-7 rounded hover:bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-sm">+</button>
    <button onclick="zoomDelta(0.8)" class="w-7 h-7 rounded hover:bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-sm">&minus;</button>
    <button onclick="resetZoom()" class="px-2 py-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white font-mono">100%</button>
  </div>

  <!-- Spatial Minimap (Bottom Right) -->
  <div class="fixed bottom-4 right-4 glass-panel w-44 h-32 rounded-xl p-2 z-30 shadow-2xl border border-slate-800 flex flex-col gap-1">
    <div class="flex items-center justify-between text-[10px] font-mono text-slate-400">
      <span>SPATIAL MINIMAP</span>
      <span class="text-cyan-400" id="shape-count">0 items</span>
    </div>
    <div class="flex-1 bg-slate-950/80 rounded border border-slate-800/80 relative overflow-hidden" id="minimap-container">
      <canvas id="minimap-canvas" class="w-full h-full"></canvas>
    </div>
  </div>

  <!-- Infinite Canvas Viewport -->
  <div class="flex-1 w-full h-full relative overflow-hidden grid-bg" id="canvas-wrapper">
    <canvas id="main-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('minimap-canvas');
    const miniCtx = miniCanvas.getContext('2d');

    let camera = { x: 0, y: 0, zoom: 1.0 };
    let currentTool = 'select';
    let currentColor = '#22d3ee';
    let isMouseDown = false;
    let isPanning = false;
    let dragStart = { x: 0, y: 0 };
    let currentDrawing = null;
    let selectedShape = null;

    let shapes = [];

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w * window.devicePixelRatio;
      canvas.height = h * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      miniCanvas.width = miniCanvas.parentElement.clientWidth * window.devicePixelRatio;
      miniCanvas.height = miniCanvas.parentElement.clientHeight * window.devicePixelRatio;
      miniCtx.scale(window.devicePixelRatio, window.devicePixelRatio);

      render();
    }
    window.addEventListener('resize', resize);

    function screenToWorld(sx, sy) {
      return {
        x: (sx - canvas.parentElement.clientWidth / 2) / camera.zoom - camera.x,
        y: (sy - canvas.parentElement.clientHeight / 2) / camera.zoom - camera.y
      };
    }

    function worldToScreen(wx, wy) {
      return {
        x: (wx + camera.x) * camera.zoom + canvas.parentElement.clientWidth / 2,
        y: (wy + camera.y) * camera.zoom + canvas.parentElement.clientHeight / 2
      };
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.glass-panel button[id^="tool-"]').forEach(btn => {
        btn.classList.remove('tool-active');
      });
      const activeBtn = document.getElementById(`tool-${tool}`);
      if (activeBtn) activeBtn.classList.add('tool-active');
      document.getElementById('active-tool-label').textContent = tool.toUpperCase();
      canvas.style.cursor = tool === 'select' ? 'default' : 'crosshair';
    }

    function setColor(color) {
      currentColor = color;
      document.querySelectorAll('button[id^="color-"]').forEach(btn => {
        btn.classList.remove('ring-2', 'ring-cyan-400/50');
      });
      const colorMap = {
        '#22d3ee': 'cyan',
        '#a855f7': 'purple',
        '#10b981': 'emerald',
        '#f59e0b': 'amber',
        '#f8fafc': 'white'
      };
      const id = colorMap[color];
      if (id) document.getElementById(`color-${id}`).classList.add('ring-2', 'ring-cyan-400/50');
    }

    function zoomDelta(factor) {
      camera.zoom = Math.max(0.2, Math.min(3.0, camera.zoom * factor));
      document.getElementById('zoom-level').textContent = `${Math.round(camera.zoom * 100)}%`;
      render();
    }

    function resetZoom() {
      camera.zoom = 1.0;
      camera.x = 0;
      camera.y = 0;
      document.getElementById('zoom-level').textContent = '100%';
      render();
    }

    function clearCanvas() {
      shapes = [];
      selectedShape = null;
      render();
    }

    // Canvas Mouse Events
    canvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const world = screenToWorld(sx, sy);
      dragStart = { x: sx, y: sy };

      if (e.button === 1 || e.spaceKey || currentTool === 'select') {
        // Check if clicking on an existing shape
        let hit = null;
        for (let i = shapes.length - 1; i >= 0; i--) {
          const s = shapes[i];
          if (world.x >= s.x && world.x <= s.x + s.w && world.y >= s.y && world.y <= s.y + s.h) {
            hit = s;
            break;
          }
        }
        if (hit && currentTool === 'select') {
          selectedShape = hit;
          isPanning = false;
        } else {
          selectedShape = null;
          isPanning = true;
        }
      } else if (currentTool === 'draw') {
        currentDrawing = {
          type: 'path',
          color: currentColor,
          points: [world]
        };
      } else if (['rect', 'circle', 'note', 'arrow'].includes(currentTool)) {
        currentDrawing = {
          type: currentTool,
          x: world.x,
          y: world.y,
          w: 0,
          h: 0,
          color: currentColor,
          title: currentTool === 'note' ? 'Sticky Note' : ''
        };
      } else if (currentTool === 'text') {
        const text = prompt('Enter text label:', 'Spatial Node');
        if (text) {
          shapes.push({
            type: 'text',
            x: world.x,
            y: world.y,
            w: 120,
            h: 30,
            color: currentColor,
            text: text
          });
          render();
        }
        isMouseDown = false;
      }
      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const world = screenToWorld(sx, sy);

      if (!isMouseDown) return;

      if (isPanning) {
        camera.x += (sx - dragStart.x) / camera.zoom;
        camera.y += (sy - dragStart.y) / camera.zoom;
        dragStart = { x: sx, y: sy };
      } else if (selectedShape) {
        selectedShape.x += (sx - dragStart.x) / camera.zoom;
        selectedShape.y += (sy - dragStart.y) / camera.zoom;
        dragStart = { x: sx, y: sy };
      } else if (currentDrawing) {
        if (currentDrawing.type === 'path') {
          currentDrawing.points.push(world);
        } else {
          currentDrawing.w = world.x - currentDrawing.x;
          currentDrawing.h = world.y - currentDrawing.y;
        }
      }
      render();
    });

    window.addEventListener('mouseup', () => {
      if (currentDrawing) {
        if (currentDrawing.type === 'path' && currentDrawing.points.length > 1) {
          shapes.push(currentDrawing);
        } else if (['rect', 'circle', 'note', 'arrow'].includes(currentDrawing.type)) {
          // Normalize negative width/height
          if (currentDrawing.w < 0) {
            currentDrawing.x += currentDrawing.w;
            currentDrawing.w = Math.abs(currentDrawing.w);
          }
          if (currentDrawing.h < 0) {
            currentDrawing.y += currentDrawing.h;
            currentDrawing.h = Math.abs(currentDrawing.h);
          }
          if (currentDrawing.w > 10 || currentDrawing.h > 10) {
            shapes.push(currentDrawing);
          }
        }
        currentDrawing = null;
      }
      isMouseDown = false;
      isPanning = false;
      render();
    });

    // Wheel Zoom & Pan
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        const factor = e.deltaY < 0 ? 1.05 : 0.95;
        zoomDelta(factor);
      } else {
        camera.x -= e.deltaX / camera.zoom;
        camera.y -= e.deltaY / camera.zoom;
        render();
      }
    }, { passive: false });

    function loadTemplate() {
      shapes = [
        { type: 'rect', x: -280, y: -120, w: 160, h: 80, color: '#22d3ee', title: 'CLI Harness' },
        { type: 'arrow', x: -120, y: -80, w: 100, h: 0, color: '#38bdf8' },
        { type: 'rect', x: -20, y: -120, w: 170, h: 80, color: '#a855f7', title: 'TUI State Engine' },
        { type: 'arrow', x: 150, y: -80, w: 100, h: 0, color: '#c084fc' },
        { type: 'rect', x: 250, y: -120, w: 180, h: 80, color: '#10b981', title: 'SkillForge Gatekeeper' },
        { type: 'arrow', x: 340, y: -40, w: 0, h: 100, color: '#34d399' },
        { type: 'rect', x: 250, y: 60, w: 180, h: 80, color: '#f59e0b', title: 'Decentralized Registry' },
        { type: 'note', x: -280, y: 30, w: 200, h: 120, color: '#22d3ee', title: 'Provenance Verification:\nAll skills verified with\ncs:sha256 cryptotokens.' }
      ];
      camera.x = 0;
      camera.y = 0;
      camera.zoom = 1.0;
      document.getElementById('zoom-level').textContent = '100%';
      render();
    }

    function render() {
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;

      ctx.clearRect(0, 0, w, h);

      // Save transform
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(camera.x, camera.y);

      // Render Shapes
      for (const s of shapes) {
        drawShape(ctx, s, s === selectedShape);
      }

      // Render Active Drawing
      if (currentDrawing) {
        drawShape(ctx, currentDrawing, false);
      }

      ctx.restore();

      // Render Minimap
      renderMinimap();
      document.getElementById('shape-count').textContent = `${shapes.length} elements`;
    }

    function drawShape(targetCtx, s, isSelected) {
      targetCtx.lineWidth = 2;

      if (s.type === 'rect') {
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        targetCtx.strokeStyle = s.color;
        targetCtx.beginPath();
        targetCtx.roundRect ? targetCtx.roundRect(s.x, s.y, s.w, s.h, 8) : targetCtx.rect(s.x, s.y, s.w, s.h);
        targetCtx.fill();
        targetCtx.stroke();

        if (s.title) {
          targetCtx.fillStyle = '#f8fafc';
          targetCtx.font = 'bold 13px ui-sans-serif, system-ui';
          targetCtx.textAlign = 'center';
          targetCtx.textBaseline = 'middle';
          targetCtx.fillText(s.title, s.x + s.w / 2, s.y + s.h / 2);
        }
      } else if (s.type === 'circle') {
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        targetCtx.strokeStyle = s.color;
        targetCtx.beginPath();
        targetCtx.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.stroke();
      } else if (s.type === 'arrow') {
        targetCtx.strokeStyle = s.color;
        targetCtx.fillStyle = s.color;
        targetCtx.lineWidth = 2.5;

        const x1 = s.x;
        const y1 = s.y;
        const x2 = s.x + s.w;
        const y2 = s.y + s.h;

        targetCtx.beginPath();
        targetCtx.moveTo(x1, y1);
        targetCtx.lineTo(x2, y2);
        targetCtx.stroke();

        // Arrow head
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const headlen = 10;
        targetCtx.beginPath();
        targetCtx.moveTo(x2, y2);
        targetCtx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
        targetCtx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
        targetCtx.fill();
      } else if (s.type === 'note') {
        targetCtx.fillStyle = 'rgba(34, 211, 238, 0.12)';
        targetCtx.strokeStyle = s.color;
        targetCtx.beginPath();
        targetCtx.roundRect ? targetCtx.roundRect(s.x, s.y, s.w, s.h, 6) : targetCtx.rect(s.x, s.y, s.w, s.h);
        targetCtx.fill();
        targetCtx.stroke();

        // Sticky Header Tag
        targetCtx.fillStyle = s.color;
        targetCtx.fillRect(s.x, s.y, s.w, 4);

        if (s.title) {
          targetCtx.fillStyle = '#e2e8f0';
          targetCtx.font = '11px monospace';
          targetCtx.textAlign = 'left';
          targetCtx.textBaseline = 'top';
          const lines = s.title.split('\n');
          lines.forEach((line, idx) => {
            targetCtx.fillText(line, s.x + 10, s.y + 12 + idx * 16);
          });
        }
      } else if (s.type === 'text') {
        targetCtx.fillStyle = s.color;
        targetCtx.font = 'bold 14px ui-sans-serif, system-ui';
        targetCtx.textAlign = 'left';
        targetCtx.textBaseline = 'top';
        targetCtx.fillText(s.text, s.x, s.y);
      } else if (s.type === 'path') {
        targetCtx.strokeStyle = s.color;
        targetCtx.lineWidth = 2.5;
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';
        targetCtx.beginPath();
        for (let i = 0; i < s.points.length; i++) {
          const pt = s.points[i];
          if (i === 0) targetCtx.moveTo(pt.x, pt.y);
          else targetCtx.lineTo(pt.x, pt.y);
        }
        targetCtx.stroke();
      }

      if (isSelected) {
        targetCtx.strokeStyle = '#38bdf8';
        targetCtx.lineWidth = 1.5;
        targetCtx.setLineDash([4, 4]);
        targetCtx.strokeRect(s.x - 4, s.y - 4, s.w + 8, s.h + 8);
        targetCtx.setLineDash([]);
      }
    }

    function renderMinimap() {
      const mw = miniCanvas.parentElement.clientWidth;
      const mh = miniCanvas.parentElement.clientHeight;

      miniCtx.clearRect(0, 0, mw, mh);

      const scale = 0.08;
      miniCtx.save();
      miniCtx.translate(mw / 2, mh / 2);
      miniCtx.scale(scale, scale);

      for (const s of shapes) {
        miniCtx.fillStyle = s.color || '#22d3ee';
        miniCtx.fillRect(s.x, s.y, s.w || 20, s.h || 20);
      }

      // Camera boundary
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;
      const viewW = w / camera.zoom;
      const viewH = h / camera.zoom;

      miniCtx.strokeStyle = '#ffffff';
      miniCtx.lineWidth = 12;
      miniCtx.strokeRect(-camera.x - viewW / 2, -camera.y - viewH / 2, viewW, viewH);

      miniCtx.restore();
    }

    // Init with template
    resize();
    loadTemplate();
  </script>
</body>
</html>
