[package]
name = "scaffold-tui"
version = "4.6.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
directories = "5.0"
zip = "0.6.6"
qrcode = "0.14.1"

[build-dependencies]
winres = "0.1.12"
