[package]
name = "scaffold-tui"
version = "7.19.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
directories = "5.0"
zip = "0.6.6"
qrcode = "0.14.1"
self_update = { version = "0.39", default-features = false, features = ["archive-zip", "archive-tar", "compression-flate2", "compression-zip-deflate", "rustls"] }
agent-client-protocol = "1.2.0"
agent-client-protocol-rmcp = "2.0.0"
rmcp = "2.2.0"
schemars = "1.2.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.32"
aes-gcm = "0.11.0"
base64 = "0.22.1"
rand = "0.8.5"

[build-dependencies]
winres = "0.1.12"

[[bin]]
name = "code-scaffold"
path = "src/main.rs"

[dev-dependencies]
regex = "1.13.1"
